<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Board - TaskFlow</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/">TaskFlow</a><nav><a href="/">Projects</a><button id="logoutBtn" class="ghost">Logout</button></nav></header><main class="container"><section class="project-header panel"><div><p class="eyebrow">Project Board</p><h1 id="projectTitle">Loading...</h1><p id="projectDescription" class="muted"></p><p id="membersText" class="muted"></p></div><div class="actions"><button id="addMemberBtn" class="secondary">+ Add Member</button><button id="newTaskBtn" class="primary">+ New Task</button></div></section><section id="taskFormCard" class="panel hidden"><h2>Create Task</h2><form id="taskForm" class="grid-form"><label>Task title<input id="taskTitle" required></label><label>Description<textarea id="taskDescription" rows="3"></textarea></label><label>Priority<select id="taskPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label>Assign to<select id="taskAssignee"></select></label><label>Due date<input id="taskDueDate" type="date"></label><div class="actions"><button class="primary">Create Task</button><button id="cancelTaskBtn" class="secondary" type="button">Cancel</button></div><p id="taskMessage"></p></form></section><section id="memberFormCard" class="panel hidden"><h2>Add Project Member</h2><form id="memberForm" class="inline-form"><input id="memberSearch" placeholder="Search name or username" required><button class="secondary">Search</button></form><div id="memberResults" class="search-results"></div><p id="memberMessage"></p></section><section class="board"><div class="column"><div class="column-title"><h2>To Do</h2><span id="countTodo">0</span></div><div id="todo" class="task-list"></div></div><div class="column"><div class="column-title"><h2>In Progress</h2><span id="countInprogress">0</span></div><div id="inprogress" class="task-list"></div></div><div class="column"><div class="column-title"><h2>Done</h2><span id="countDone">0</span></div><div id="done" class="task-list"></div></div></section></main><div id="taskModal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><h2 id="modalTaskTitle"></h2><p id="modalTaskDescription" class="muted"></p><div id="modalTaskMeta" class="task-meta"></div><div class="comment-box"><h3>Comments</h3><div id="comments"></div><form id="commentForm" class="inline-form"><input id="commentText" placeholder="Write a comment..." maxlength="500" required><button class="primary">Send</button></form></div></div></div><script src="/js/project.js"></script></body></html>
