<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><a class="brand" href="/">TaskFlow</a><nav><span id="welcome"></span><button id="logoutBtn" class="ghost">Logout</button></nav></header><main class="container"><section class="hero"><div><p class="eyebrow">CodeAlpha Task 3</p><h1>Project Management Tool</h1><p class="muted">Create projects, assign tasks, and communicate with your team.</p></div><button id="newProjectBtn" class="primary">+ New Project</button></section><section id="projectFormCard" class="panel hidden"><h2>Create Project</h2><form id="projectForm" class="grid-form"><label>Project name<input id="projectName" required></label><label>Description<textarea id="projectDescription" rows="3"></textarea></label><div class="actions"><button class="primary">Create</button><button id="cancelProjectBtn" class="secondary" type="button">Cancel</button></div><p id="projectMessage"></p></form></section><section><div class="section-heading"><h2>Your Projects</h2><button id="refreshBtn" class="secondary">Refresh</button></div><div id="projects" class="project-grid"></div><p id="emptyProjects" class="empty hidden">No projects yet. Create your first project.</p></section></main><script src="/js/app.js"></script></body></html>
