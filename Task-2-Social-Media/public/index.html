<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeAlpha Social</title><link rel="stylesheet" href="/css/style.css"></head><body>
<header><div class="nav"><a class="brand" href="/">CodeAlpha Social</a><div id="navLinks"></div></div></header>
<main class="container"><section id="authPanel" class="card"><h1>Welcome</h1><p>Login or register to use the social media platform.</p><div class="actions"><a class="btn" href="/login.html">Login</a><a class="btn secondary" href="/register.html">Register</a></div></section>
<section id="appPanel" hidden><div class="grid"><aside><div class="card"><h3>My Profile</h3><div id="myProfile"></div><a class="text-link" href="#" id="editProfile">Edit profile</a></div><div class="card"><h3>Find People</h3><input id="searchUsers" placeholder="Search users"><div id="searchResults"></div></div></aside><section><div class="card composer"><h2>Create a post</h2><textarea id="postText" rows="4" placeholder="What's on your mind?"></textarea><input id="postImage" placeholder="Optional image URL"><button class="btn" id="createPost">Post</button></div><div id="feed"></div></section></div></section></main>
<div id="toast"></div><script src="/js/app.js"></script></body></html>
