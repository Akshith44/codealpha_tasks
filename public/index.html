<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Shop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/">CodeAlpha<span>Shop</span></a>
    <nav>
      <a href="/">Home</a>
      <a href="/orders.html">My Orders</a>
      <a href="/cart.html">Cart <b id="cartCount">0</b></a>
      <a href="/login.html" id="loginLink">Login</a>
      <button class="link-btn hidden" id="logoutBtn">Logout</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="tag">CODEALPHA • TASK 1</p>
        <h1>Simple E-commerce Store</h1>
        <p>Browse products, add them to your cart and place an order.</p>
        <a class="btn" href="#products">Shop Now</a>
      </div>
      <div class="hero-card">🛒<br><small>Easy • Fast • Secure</small></div>
    </section>

    <section id="products" class="section">
      <div class="section-heading">
        <div>
          <h2>Products</h2>
          <p class="muted">Choose from our collection.</p>
        </div>
        <div class="filters">
          <input id="search" type="search" placeholder="Search products...">
          <select id="category">
            <option>All</option>
            <option>Electronics</option>
            <option>Fashion</option>
            <option>Accessories</option>
            <option>Home</option>
          </select>
        </div>
      </div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <footer>CodeAlpha Full Stack Development Internship • Task 1</footer>
  <script src="/js/app.js"></script>
</body>
</html>
